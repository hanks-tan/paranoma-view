<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width, shrink-to-fit=no">
    <title>360全景图查看器</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
      }

      a:link, a:visited{
        color: #bdc3c7;
      }

      .credit{
        position: absolute;
        text-align: center;
        width: 100%;
        padding: 20px 0;
        color: #fff;
      }
    </style>
  </head>

  <body>
    <script src="/lib/three.min.js"></script>
    <script src="/lib/panolens.min.js"></script>

    <script>
      let url = '/public/images/panorama.jpg'
      if (window.location.search) {
        const params = new URLSearchParams(window.location.search);
        url = params.get('url') || url;
        console.log('url', url)
      }
      const panorama = new PANOLENS.ImagePanorama( '/public/images/panorama.jpg' );
      const viewer = new PANOLENS.Viewer( { output: 'console' } );
      viewer.add( panorama );

    </script>

  </body>
</html>
